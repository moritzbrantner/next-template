name: One-shot convergence repair

on:
  push:
    branches:
      - fix/integration-observability-mocks

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: fix/integration-observability-mocks
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Repair server-safe UI helper imports
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          root_import = re.compile(
              r"import\s*\{(?P<body>.*?)\}\s*from '@moritzbrantner/ui';",
              re.DOTALL,
          )
          changed = []
          ignored_parts = {'.git', '.next', 'node_modules', 'dist', 'storybook-static'}

          for path in Path('.').rglob('*.tsx'):
              if ignored_parts.intersection(path.parts):
                  continue
              text = path.read_text()
              if 'buttonVariants' not in text or "from '@moritzbrantner/ui'" not in text:
                  continue
              if re.match(r"\s*(['\"])use client\1;", text):
                  continue

              def replace_import(match: re.Match[str]) -> str:
                  body = match.group('body')
                  names = [name.strip() for name in body.split(',') if name.strip()]
                  if 'buttonVariants' not in names:
                      return match.group(0)
                  names.remove('buttonVariants')
                  root = ''
                  if names:
                      root = "import {\n" + ''.join(f"  {name},\n" for name in names) + "} from '@moritzbrantner/ui';\n"
                  return root + "import { buttonVariants } from '@moritzbrantner/ui/components/stable/button-variants';"

              updated, replacements = root_import.subn(replace_import, text)
              if replacements and updated != text:
                  path.write_text(updated)
                  changed.append(str(path))

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['dependencies']['@moritzbrantner/ui'] = '^1.1.0'
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          Path('/tmp/server-safe-files.txt').write_text('\n'.join(changed) + ('\n' if changed else ''))
          print(f'updated {len(changed)} server-side TSX consumers')
          if not changed:
              raise SystemExit('expected at least one server-side buttonVariants consumer')
          PY
      - name: Regenerate Bun lockfile
        run: bun install
      - name: Format touched source
        shell: bash
        run: |
          while IFS= read -r file; do
            [ -n "$file" ] && bunx oxfmt --write "$file"
          done < /tmp/server-safe-files.txt
          bunx oxfmt --write package.json
      - name: Validate repair locally
        run: |
          bun run typecheck
          bun run test:integration
      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/convergence-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: use server-safe UI helpers"
          git push origin HEAD:fix/integration-observability-mocks
