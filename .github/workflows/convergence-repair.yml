name: One-shot convergence repair

on:
  push:
    branches:
      - fix/integration-observability-mocks

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: fix/integration-observability-mocks
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Update Next.js packages
        run: bun update next@16.3.5 @next/mdx@16.3.5 @next/eslint-plugin-next@16.3.5
      - name: Verify repaired dependency surface
        run: |
          bun run supply-chain:audit
          bun run typecheck
          bun run test:integration
      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/convergence-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: update Next.js past critical advisories"
          git push origin HEAD:fix/integration-observability-mocks
