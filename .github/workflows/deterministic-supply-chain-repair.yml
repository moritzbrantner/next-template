name: Deterministic supply-chain repair

on:
  push:
    branches:
      - fix/integration-observability-mocks
    paths:
      - .github/workflows/deterministic-supply-chain-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/integration-observability-mocks
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install frozen baseline
        run: bun install --frozen-lockfile
      - name: Align audited dependencies and stabilize the slow integration boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          package["devDependencies"]["vitest"] = "4.1.11"
          package.setdefault("overrides", {})["shell-quote"] = "1.10.0"
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          test_path = Path("src/app-config/feature-gating.integration.test.ts")
          text = test_path.read_text()
          if "  }, 10_000);\n\n  it('removes follow behavior" not in text:
              first_test = text.find("  it('returns 404 for the signup endpoint and page when registration is disabled'")
              next_test = text.find("  it('removes follow behavior", first_test)
              if first_test < 0 or next_test < 0:
                  raise SystemExit("feature-gating test boundaries not found")
              close = text.rfind("\n  });", first_test, next_test)
              if close < 0:
                  raise SystemExit("feature-gating test closure not found")
              text = text[:close] + "\n  }, 10_000);" + text[close + len("\n  });"):]
          test_path.write_text(text)
          PY
          bunx oxfmt@0.51.0 --write package.json src/app-config/feature-gating.integration.test.ts
          bun install
      - name: Verify critical audit is clear
        run: bun audit --audit-level=critical
      - name: Validate generated package state
        run: |
          bun install --frozen-lockfile
          bun run checks:nightly
          git diff --check
      - name: Commit package-manager-generated repair
        run: |
          git rm .github/workflows/deterministic-supply-chain-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock src/app-config/feature-gating.integration.test.ts
          git diff --cached --quiet && { echo "No dependency changes produced"; exit 1; }
          git commit -m "fix: clear critical dependency audit"
          git push origin HEAD:fix/integration-observability-mocks
