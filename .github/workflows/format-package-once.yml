name: Format package once

on:
  push:
    branches: [chore/deterministic-template-baseline]
    paths:
      - .github/workflows/format-package-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: chore/deterministic-template-baseline

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format package manifest
        run: ./node_modules/.bin/oxfmt --write package.json

      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json
          git diff --cached --quiet && exit 0
          git commit -m "style: format package manifest"
          git push origin HEAD:chore/deterministic-template-baseline
