name: Refresh UI lockfile

on:
  push:
    branches:
      - fix/integration-observability-mocks

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Regenerate and commit canonical lockfile
        run: |
          bun install
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git rm .github/workflows/refresh-ui-lock.yml
          git commit -m "fix: refresh UI 1.1 lockfile"
          git push origin HEAD:${{ github.ref_name }}
