name: Restore Vitest pin

on:
  push:
    branches: [chore/deterministic-template-baseline]
    paths:
      - .github/workflows/restore-vitest-pin.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: chore/deterministic-template-baseline

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Restore test-runner pin and refresh lock
        run: |
          bun -e "const fs=require('node:fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.devDependencies.vitest='4.1.7'; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\\n');"
          bun install

      - name: Give the cold feature-gating test a focused budget
        run: |
          bun -e "const fs=require('node:fs'); const path='src/app-config/feature-gating.integration.test.ts'; let s=fs.readFileSync(path,'utf8'); const before=\"  });\\n\\n  it('removes follow behavior\"; const after=\"  }, 10_000);\\n\\n  it('removes follow behavior\"; if(!s.includes(before)) throw new Error('target not found'); fs.writeFileSync(path,s.replace(before,after));"
          ./node_modules/.bin/oxfmt --write package.json src/app-config/feature-gating.integration.test.ts

      - name: Verify audit, formatting, and integration
        run: |
          bun audit --audit-level=critical
          bun run lint:format
          bun run test:integration

      - name: Commit verified remediation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json bun.lock src/app-config/feature-gating.integration.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "test: stabilize deterministic validation"
          git push origin HEAD:chore/deterministic-template-baseline
