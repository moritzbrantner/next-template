name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

jobs:
  fast:
    name: Fast Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run fast checks with Storybook accessibility
        run: bun run checks:nightly

      - name: Upload Storybook artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: storybook-results
          path: storybook-static

  integration:
    name: Integration Validation
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run integration tests
        run: bun run test:integration

  full:
    name: Full Validation
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check database migrations
        run: bun run db:check

      - name: Build app
        run: bun run build:check

      - name: Run Unlighthouse benchmarks
        env:
          AUTH_SECRET: ci-build-secret-ci-build-secret
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/next_template?schema=public
          SITE_URL: http://127.0.0.1:3000
          EMAIL_PROVIDER: smtp
          EMAIL_FROM: no-reply@example.com
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          SMTP_USER: ci
          SMTP_PASSWORD: ci
          SMTP_SECURE: 'false'
          INTERNAL_CRON_SECRET: ci-cron-secret
        run: bun run bench:unlighthouse

      - name: Upload Unlighthouse artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unlighthouse-results
          path: |
            .generated/unlighthouse
            out

      - name: Run e2e tests
        run: ./scripts/ci/run-e2e.sh

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-results
          path: |
            test-results
            playwright-report
