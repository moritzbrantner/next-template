name: next-template

services:
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    container_name: next-template-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: next_template
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '${POSTGRES_PORT:-55433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d next_template']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    container_name: next-template-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI

  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    container_name: next-template-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  rustfs:
    # S3-compatible object storage (MinIO drop-in). Pinned by tag and digest.
    image: docker.io/rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    container_name: next-template-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: '${S3_ROOT_USER:-rustfsadmin}'
      RUSTFS_SECRET_KEY: '${S3_ROOT_PASSWORD:-rustfsadmin}'
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '${S3_API_PORT:-9000}:9000' # S3 API
      - '${S3_CONSOLE_PORT:-9001}:9001' # Web console
    volumes:
      - rustfs_data:/data

  rustfs-create-bucket:
    image: docker.io/amazon/aws-cli:2.39.1@sha256:3517c17b5f01637df3b6184a4280fbcc36e4ea38105954cade628ff17bb9a7b9
    depends_on:
      - rustfs
    restart: 'no'
    environment:
      AWS_ACCESS_KEY_ID: '${S3_ROOT_USER:-rustfsadmin}'
      AWS_SECRET_ACCESS_KEY: '${S3_ROOT_PASSWORD:-rustfsadmin}'
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://rustfs:9000
      S3_BUCKET: '${S3_BUCKET:-profile-images}'
    # Creates the bucket (idempotent) and grants anonymous read on its objects,
    # matching what the app expects from PROFILE_IMAGE_PUBLIC_BASE_URL.
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        until aws s3api list-buckets >/dev/null 2>&1; do sleep 1; done
        aws s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null || aws s3api create-bucket --bucket "$$S3_BUCKET"
        aws s3api put-bucket-policy --bucket "$$S3_BUCKET" --policy "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::$$S3_BUCKET/*\"]}]}"

volumes:
  postgres_data:
  rustfs_data:
  redis_data:

networks:
  default:
    ipam:
      config:
        - subnet: 10.90.4.0/24
